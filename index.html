<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bản đồ 9 Khu phố phường Tân Hải</title>
    <!-- Tải thư viện CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: Arial, sans-serif; }
        #header { background-color: #004a99; color: white; padding: 15px; text-align: center; }
        #header h1 { margin: 0; font-size: 22px; }
        #header p { margin: 5px 0 0 0; font-size: 14px; }
        #map { height: calc(100vh - 80px); width: 100%; }
        
        .legend { background: white; padding: 10px; border-radius: 5px; box-shadow: 0 0 15px rgba(0,0,0,0.2); line-height: 24px; font-size: 14px;}
        .legend i { width: 18px; height: 18px; float: left; margin-right: 8px; opacity: 0.9; border-radius: 50%; border: 1px solid #999;}

        /* ========================================= */
        /* CSS TẠO HIỆU ỨNG NHẤP NHÁY (MỚI THÊM)     */
        /* ========================================= */
        .diem-nhap-nhay {
            animation: chopTat 0.8s infinite alternate;
        }
        @keyframes chopTat {
            0% { opacity: 1; }
            100% { opacity: 0.2; } /* Làm mờ đi tạo cảm giác chớp tắt */
        }
    </style>
</head>
<body>

    <div id="header">
        <h1>🗺️ BẢN ĐỒ 9 KHU PHỐ PHƯỜNG TÂN HẢI</h1>
        <p>Tỷ lệ người dân cần khám sức khỏe các khu phố trên địa bàn phường</p>
    </div>

    <!-- Khung chứa bản đồ -->
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // Khởi tạo bản đồ
        var map = L.map('map').setView([10.5360, 107.1350], 13);

        // Lớp bản đồ nền đường xá Google Maps
        L.tileLayer('https://mt1.google.com/vt/lyrs=m&x={x}&y={y}&z={z}', {
            attribution: '© Google Maps',
            maxZoom: 20
        }).addTo(map);

        // Chèn ảnh ranh giới
        var imageUrl = './anh_ranh_gioi_tan_hai.png'; 
        var imageBounds = [[10.5015, 107.0985], [10.5720, 107.1680]]; 
        L.imageOverlay(imageUrl, imageBounds, {
            opacity: 0.65, 
            interactive: false 
        }).addTo(map);

        // 4. Dữ liệu 9 khu phố 
        var khuPhoData = [
            { name: "Khu phố Phước Thành", lat: 10.5550, lng: 107.1450, tyle: 86.5 }, 
            { name: "Khu phố Phước Tân", lat: 10.5400, lng: 107.1260, tyle: 82.0 },   
            { name: "Khu phố Phước Hiệp", lat: 10.5346, lng: 107.1213, tyle: 75.2 },  
            { name: "Khu phố Láng Cát", lat: 10.5300, lng: 107.1300, tyle: 88.1 },    
            { name: "Khu phố Chu Hải", lat: 10.5380, lng: 107.1470, tyle: 90.0 },     
            { name: "Khu phố Đông Hải", lat: 10.5241, lng: 107.1425, tyle: 81.4 },    
            { name: "Khu phố Phước Hải", lat: 10.5230, lng: 107.1357, tyle: 79.9 },   
            { name: "Khu phố Cát Hải", lat: 10.5211, lng: 107.1274, tyle: 84.5 },     
            { name: "Khu phố Phước Long", lat: 10.5150, lng: 107.1080, tyle: 70.0 }   
        ];

       // Vẽ các chấm tròn và gán hiệu ứng
        khuPhoData.forEach(function(kp) {
            var markerColor = "";
            var classHieuUng = ""; // Biến để chứa class nhấp nháy

            // Phân loại màu sắc và hiệu ứng
            if (kp.tyle >= 85) {
                markerColor = "#28a745"; // Xanh lá
                classHieuUng = "diem-nhap-nhay"; // CHỈ GẮN NHẤP NHÁY CHO TỶ LỆ CAO
            } else if (kp.tyle >= 80) {
                markerColor = "#ffc107"; // Vàng
            } else {
                markerColor = "#dc3545"; // Đỏ
            }

            var circleMarker = L.circleMarker([kp.lat, kp.lng], {
                radius: 12,
                fillColor: markerColor,
                color: "#000",
                weight: 1,
                opacity: 1,
                fillOpacity: 0.9,
                className: classHieuUng // Đưa class nhấp nháy vào marker
            }).addTo(map);

            circleMarker.bindPopup("<div style='text-align:center;'><b>" + kp.name + "</b><br>Tỷ lệ cần khám: <b>" + kp.tyle + "%</b></div>");
        });

        // Bảng chú giải
        var legend = L.control({position: 'bottomright'});
        legend.onAdd = function (map) {
            var div = L.DomUtil.create('div', 'legend');
            div.innerHTML += '<b>Tỷ lệ cần khám</b><br>';
            div.innerHTML += '<i style="background: #28a745"></i> ≥ 85%<br>';
            div.innerHTML += '<i style="background: #ffc107"></i> 80 – 84,9%<br>';
            div.innerHTML += '<i style="background: #dc3545"></i> &lt; 80%<br>';
            return div;
        };
        legend.addTo(map);

        // Công cụ bấm chuột lấy tọa độ (Mình vẫn giữ lại phòng khi bạn cần dời thêm)
        map.on('click', function(e) {
            var lat = e.latlng.lat.toFixed(4);
            var lng = e.latlng.lng.toFixed(4);
            alert("Tọa độ điểm bạn vừa bấm:\nlat: " + lat + "\nlng: " + lng);
        });

    </script>
</body>
</html>
