<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bản đồ 9 Khu phố phường Tân Hải</title>
    <!-- Thư viện Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <!-- Thư viện Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        /* Cài đặt chung */
        body { margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #e9ecef;}
        
        /* Bản đồ tràn viền 100% màn hình */
        #map { height: 100vh; width: 100%; z-index: 1;}
        
        /* Giao diện Header nổi */
        #header { 
            position: absolute; 
            top: 20px; 
            left: 50%; 
            transform: translateX(-50%); 
            z-index: 1000; 
            background: rgba(255, 255, 255, 0.9); 
            backdrop-filter: blur(8px);
            color: #004a99; 
            padding: 12px 30px; 
            text-align: center; 
            border-radius: 50px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.15);
            border: 1px solid rgba(255,255,255,0.6);
            white-space: nowrap;
        }
        #header h1 { margin: 0; font-size: 20px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.5px;}
        #header p { margin: 3px 0 0 0; font-size: 13px; color: #444; font-weight: 500;}
        
        /* Bảng chú giải */
        .legend { 
            background: rgba(255, 255, 255, 0.95); 
            padding: 15px 20px; 
            border-radius: 12px; 
            box-shadow: 0 5px 20px rgba(0,0,0,0.15); 
            line-height: 26px; 
            font-size: 14px;
            color: #333;
        }
        .legend b { font-size: 15px; color: #004a99; display: block; margin-bottom: 5px;}
        .legend i { width: 16px; height: 16px; float: left; margin-right: 10px; margin-top: 5px; border-radius: 50%; border: 1px solid #fff; box-shadow: 0 0 4px rgba(0,0,0,0.4);}

        /* Popup thông tin chi tiết */
        .leaflet-popup-content-wrapper { border-radius: 10px; box-shadow: 0 5px 20px rgba(0,0,0,0.25); }
        .leaflet-popup-content { margin: 15px 18px; font-size: 14px; line-height: 1.6; color: #222; }
        .popup-title { font-size: 18px; font-weight: bold; color: #111; border-bottom: 2px solid #ccc; padding-bottom: 6px; margin-bottom: 10px; text-transform: uppercase; }
        .popup-row { margin-bottom: 4px; }
        .popup-row-highlight { background-color: #e6f0fa; padding: 4px 8px; border-radius: 5px; margin: 6px 0; border-left: 3px solid #004a99; font-weight: 600; color: #004a99; }
        
        /* Hiệu ứng nhịp đập */
        .diem-nhap-nhay {
            animation: nhipDap 1.2s infinite ease-in-out;
        }
        @keyframes nhipDap {
            0% { fill-opacity: 0.5; stroke-width: 1; }
            50% { fill-opacity: 1; stroke-width: 5; stroke: rgba(40, 167, 69, 0.6); }
            100% { fill-opacity: 0.5; stroke-width: 1; }
        }

        /* Nút Bật/Tắt Biểu đồ */
        #chart-toggle-btn {
            position: absolute;
            bottom: 25px;
            left: 20px;
            z-index: 1000;
            background: #004a99;
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 25px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,0,0,0.25);
            transition: all 0.3s ease;
        }
        #chart-toggle-btn:hover { background: #003366; transform: translateY(-2px); }

        /* Khung Biểu đồ */
        #chart-container {
            position: absolute;
            bottom: 75px;
            left: 20px;
            z-index: 1000;
            width: 380px;
            height: 260px;
            background: rgba(255, 255, 255, 0.93);
            backdrop-filter: blur(10px);
            border-radius: 16px;
            padding: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.25);
            border: 1px solid rgba(255,255,255,0.7);
            display: none;
        }
        #chart-container h4 {
            margin: 0 0 10px 0;
            font-size: 14px;
            color: #004a99;
            text-align: center;
            text-transform: uppercase;
        }
    </style>
</head>
<body>

    <div id="header">
        <h1>🗺️ BẢN ĐỒ PHƯỜNG TÂN HẢI</h1>
        <p>Cập nhật số liệu khám sức khỏe đợt 20/08 - 24/08/2026</p>
    </div>

    <div id="map"></div>

    <button id="chart-toggle-btn" onclick="toggleChart()">📊 Biểu đồ tỷ lệ</button>

    <div id="chart-container">
        <h4>Tỷ lệ cần khám sức khỏe (%)</h4>
        <div style="height: 210px;">
            <canvas id="rateChart"></canvas>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        var map = L.map('map', {zoomControl: false}).setView([10.5150, 107.1200], 13);
        
        L.control.zoom({ position: 'bottomleft' }).addTo(map);

        L.tileLayer('https://mt1.google.com/vt/lyrs=m&x={x}&y={y}&z={z}', {
            attribution: '© Google Maps',
            maxZoom: 20
        }).addTo(map);

        // Dữ liệu 9 khu phố (HOÀN THÀNH CẬP NHẬT 100% SỐ LIỆU ĐỢT KHÁM 20-24/08/2026)
        var khuPhoData = [
            { 
                name: "Đông Hải", lat: 10.5080, lng: 107.1350, 
                tyle: 81.4, danhGia: "Trung bình", tongCong: "2.100", tuoi18_60: "1.700", 
                laoDongTuDo: "1.360", tuoi60TroLen: "400", congTuoi18TroLen: "2.100", soCanKham: "1.709,4",
                daKhamDot: "247 (179 người 18-59t | 68 người ≥60t)" 
            },
            { 
                name: "Phước Hải", lat: 10.5020, lng: 107.1280, 
                tyle: 79.9, danhGia: "Mức thấp", tongCong: "2.400", tuoi18_60: "1.950", 
                laoDongTuDo: "1.560", tuoi60TroLen: "450", congTuoi18TroLen: "2.400", soCanKham: "1.917,6",
                daKhamDot: "103 (76 người 18-59t | 27 người ≥60t)" 
            },
            { 
                name: "Cát Hải", lat: 10.4950, lng: 107.1120, 
                tyle: 84.5, danhGia: "Trung bình", tongCong: "2.700", tuoi18_60: "2.200", 
                laoDongTuDo: "1.760", tuoi60TroLen: "500", congTuoi18TroLen: "2.700", soCanKham: "2.281,5",
                daKhamDot: "102 (77 người 18-59t | 25 người ≥60t)" 
            },
            { 
                name: "Chu Hải", lat: 10.5000, lng: 107.1200, 
                tyle: 83.6, danhGia: "Trung bình", tongCong: "3.143", tuoi18_60: "2.583", 
                laoDongTuDo: "2.066,4", tuoi60TroLen: "560", congTuoi18TroLen: "3.143", soCanKham: "2.626,4",
                daKhamDot: "73 (56 người 18-59t | 17 người ≥60t)" 
            },
            { 
                name: "Láng Cát", lat: 10.5180, lng: 107.1250, 
                tyle: 88.1, danhGia: "Tốt", tongCong: "3.000", tuoi18_60: "2.400", 
                laoDongTuDo: "1.920", tuoi60TroLen: "600", congTuoi18TroLen: "3.000", soCanKham: "2.643",
                daKhamDot: "44 (40 người 18-59t | 4 người ≥60t)" 
            },
            { 
                name: "Phước Thành", lat: 10.5420, lng: 107.1350, 
                tyle: 86.5, danhGia: "Tốt", tongCong: "2.850", tuoi18_60: "2.300", 
                laoDongTuDo: "1.840", tuoi60TroLen: "550", congTuoi18TroLen: "2.850", soCanKham: "2.465,25",
                daKhamDot: "57 (40 người 18-59t | 17 người ≥60t)"
            },
            { 
                name: "Phước Hiệp", lat: 10.5260, lng: 107.1120, 
                tyle: 75.2, danhGia: "Mức thấp", tongCong: "1.900", tuoi18_60: "1.500", 
                laoDongTuDo: "1.200", tuoi60TroLen: "400", congTuoi18TroLen: "1.900", soCanKham: "1.428,8",
                daKhamDot: "116 (79 người 18-59t | 37 người ≥60t)"
            },
            { 
                name: "Phước Long", lat: 10.4900, lng: 107.1020, 
                tyle: 70.0, danhGia: "Mức thấp", tongCong: "1.800", tuoi18_60: "1.450", 
                laoDongTuDo: "1.160", tuoi60TroLen: "350", congTuoi18TroLen: "1.800", soCanKham: "1.260",
                daKhamDot: "67 (49 người 18-59t | 18 người ≥60t)"
            },
            { 
                name: "Phước Tân", lat: 10.5320, lng: 107.1220, 
                tyle: 82.0, danhGia: "Trung bình", tongCong: "2.500", tuoi18_60: "2.000", 
                laoDongTuDo: "1.600", tuoi60TroLen: "500", congTuoi18TroLen: "2.500", soCanKham: "2.050",
                daKhamDot: "53 (34 người 18-59t | 19 người ≥60t)"
            }
        ];

        var markersList = [];

        khuPhoData.forEach(function(kp) {
            var markerColor = "";
            var classHieuUng = "";

            if (kp.tyle >= 85) {
                markerColor = "#28a745"; 
                classHieuUng = "diem-nhap-nhay"; 
            } else if (kp.tyle >= 80) {
                markerColor = "#ffc107"; 
            } else {
                markerColor = "#dc3545"; 
            }

            var circleMarker = L.circleMarker([kp.lat, kp.lng], {
                radius: 12,
                fillColor: markerColor,
                color: "#fff",
                weight: 1.5,
                opacity: 1,
                fillOpacity: 0.9,
                className: classHieuUng 
            }).addTo(map);

            circleMarker.bindTooltip("<b>KHU PHỐ " + kp.name + "</b>", {
                direction: 'top', 
                offset: [0, -10],
                opacity: 0.9
            });

            var popupContent = `
                <div class="popup-title">KHU PHỐ ${kp.name}</div>
                <div class="popup-row">Tỷ lệ: <b style="color:${markerColor}; font-size:15px;">${kp.tyle}%</b> — ${kp.danhGia}</div>
                <div class="popup-row">Tổng cộng: <b>${kp.tongCong}</b></div>
                <div class="popup-row">18—<60 tuổi: ${kp.tuoi18_60}</div>
                <div class="popup-row">Ước tính lao động tự do (80%): ${kp.laoDongTuDo}</div>
                <div class="popup-row">Từ 60 tuổi trở lên: ${kp.tuoi60TroLen}</div>
                <div class="popup-row">Cộng từ 18 tuổi trở lên: ${kp.congTuoi18TroLen}</div>
                <div class="popup-row">Số cần khám: <b>${kp.soCanKham}</b></div>
                <div class="popup-row-highlight">📋 Đã khám đợt 20-24/08: <b>${kp.daKhamDot}</b></div>
            `;
            
            circleMarker.bindPopup(popupContent);
            markersList.push(circleMarker);
        });

        // Bảng chú giải
        var legend = L.control({position: 'bottomright'});
        legend.onAdd = function (map) {
            var div = L.DomUtil.create('div', 'legend');
            div.innerHTML += '<b>Tỷ lệ cần khám</b>';
            div.innerHTML += '<i style="background: #28a745"></i> Đạt chuẩn (≥ 85%)<br>';
            div.innerHTML += '<i style="background: #ffc107"></i> Cần chú ý (80 - 84.9%)<br>';
            div.innerHTML += '<i style="background: #dc3545"></i> Mức thấp (< 80%)<br>';
            return div;
        };
        legend.addTo(map);

        // Biểu đồ Chart.js
        var labels = khuPhoData.map(d => d.name);
        var dataValues = khuPhoData.map(d => d.tyle);
        var barColors = khuPhoData.map(d => d.tyle >= 85 ? '#28a745' : (d.tyle >= 80 ? '#ffc107' : '#dc3545'));

        var ctx = document.getElementById('rateChart').getContext('2d');
        var rateChart = new Chart(ctx, {
            type: 'bar',
            data: {
                labels: labels,
                datasets: [{
                    label: 'Tỷ lệ %',
                    data: dataValues,
                    backgroundColor: barColors,
                    borderRadius: 4,
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: { legend: { display: false } },
                scales: {
                    y: { beginAtZero: true, max: 100, ticks: { callback: v => v + '%' } },
                    x: { ticks: { font: { size: 10 } } }
                },
                onClick: (e, activeElements) => {
                    if (activeElements.length > 0) {
                        var index = activeElements[0].index;
                        var targetKp = khuPhoData[index];
                        map.flyTo([targetKp.lat, targetKp.lng], 15);
                        markersList[index].openPopup();
                    }
                }
            }
        });

        function toggleChart() {
            var container = document.getElementById('chart-container');
            var btn = document.getElementById('chart-toggle-btn');
            if (container.style.display === 'none' || container.style.display === '') {
                container.style.display = 'block';
                btn.innerHTML = '✖ Đóng biểu đồ';
            } else {
                container.style.display = 'none';
                btn.innerHTML = '📊 Biểu đồ tỷ lệ';
            }
        }
    </script>
</body>
</html>
