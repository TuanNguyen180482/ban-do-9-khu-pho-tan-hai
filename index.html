<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Bản đồ Khám Sức Khỏe - Phường Tân Hải (Quản Lý Động)</title>
    
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <!-- Fonts & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { 
            margin: 0; padding: 0; 
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif; 
            background-color: #0f172a; color: #0f172a;
            overflow: hidden; height: 100vh; width: 100vw;
        }
        
        #map { height: 100vh; width: 100%; z-index: 1;}

        /* Header Glassmorphism */
        #header { 
            position: absolute; top: 16px; left: 50%; transform: translateX(-50%); 
            z-index: 1000; 
            background: rgba(255, 255, 255, 0.9); 
            backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            padding: 12px 20px; text-align: center; 
            border-radius: 24px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.12);
            border: 1px solid rgba(255, 255, 255, 0.8);
            width: calc(100% - 24px); max-width: 680px;
        }
        #header h1 { 
            margin: 0; font-size: 16px; font-weight: 800; 
            background: linear-gradient(135deg, #0284c7 0%, #0369a1 100%);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            text-transform: uppercase;
        }
        #header p { margin: 2px 0 0 0; font-size: 10px; color: #64748b; font-weight: 700;}
        
        /* Mini Dashboard Thống kê */
        .stats-summary {
            display: flex; gap: 8px; justify-content: center;
            margin-top: 8px; padding-top: 8px;
            border-top: 1px solid rgba(226, 232, 240, 0.8);
        }
        .stat-card {
            background: rgba(241, 245, 249, 0.9); padding: 5px 10px;
            border-radius: 12px; border: 1px solid #e2e8f0;
            font-size: 10px; color: #475569; font-weight: 700; flex: 1; text-align: center;
        }
        .stat-card b { font-size: 12px; font-weight: 800; margin-left: 2px; }

        /* BẢNG NHẬP SỐ LIỆU ĐỘNG (INPUT PANEL) */
        #admin-panel {
            position: absolute; top: 16px; right: 16px; z-index: 1001;
            width: 320px; max-height: calc(100vh - 80px);
            background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(20px);
            border-radius: 20px; padding: 16px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.2); border: 1px solid #ffffff;
            display: none; overflow-y: auto; animation: fadeIn 0.3s ease;
        }
        #admin-panel h3 { margin: 0 0 12px 0; font-size: 13px; font-weight: 800; color: #0284c7; text-transform: uppercase; text-align: center; }
        .input-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; font-size: 11px; font-weight: 700; gap: 6px; }
        .input-row label { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .input-row input { width: 70px; padding: 4px 6px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 11px; font-weight: 700; text-align: center; color: #0f172a; }
        .input-row input:focus { border-color: #0284c7; outline: none; background: #f0f9ff; }

        /* Nhãn Tên Khu Phố */
        .khupho-label {
            background: rgba(255, 255, 255, 0.96);
            border: 1.5px solid #0284c7; border-radius: 20px;
            padding: 3px 10px; font-size: 11px; font-weight: 800; color: #0f172a;
            box-shadow: 0 6px 16px rgba(0,0,0,0.15); white-space: nowrap;
            display: inline-flex; align-items: center; gap: 6px; cursor: pointer;
            transform: translate(-50%, -50%);
        }
        .khupho-label span { background: #0284c7; color: #fff; border-radius: 10px; padding: 1px 6px; font-size: 10px; font-weight: 800; }
        .khupho-label.label-warning { border-color: #dc2626; }
        .khupho-label.label-warning span { background: #dc2626; }

        /* Group Nút Điều Khiển */
        .controls-group { position: absolute; bottom: 20px; left: 16px; z-index: 1000; display: flex; gap: 8px; }
        .btn-custom {
            background: linear-gradient(135deg, #0284c7 0%, #0369a1 100%);
            color: white; border: none; padding: 10px 16px; border-radius: 25px;
            font-size: 11px; font-weight: 800; cursor: pointer;
            box-shadow: 0 8px 20px rgba(2, 132, 199, 0.35); transition: all 0.2s ease;
            display: flex; align-items: center; gap: 6px;
        }
        .btn-custom:hover { transform: translateY(-2px); }
        .btn-secondary-custom { background: rgba(255, 255, 255, 0.9); color: #334155; border: 1px solid #cbd5e1; }
        .btn-edit { background: linear-gradient(135deg, #16a34a 0%, #15803d 100%); }

        /* Frame Biểu đồ */
        #chart-container {
            position: absolute; bottom: 65px; left: 16px; z-index: 1000;
            width: calc(100vw - 32px); max-width: 400px; height: 300px;
            background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(20px);
            border-radius: 24px; padding: 14px; box-shadow: 0 25px 50px rgba(0,0,0,0.18);
            display: none;
        }
        #chart-container h4 { margin: 0 0 8px 0; font-size: 11px; font-weight: 800; color: #0284c7; text-align: center; text-transform: uppercase; }

        /* Thông tin Đơn vị thiết kế */
        #footer-credits {
            position: absolute; bottom: 12px; right: 12px; z-index: 1000;
            background: rgba(255, 255, 255, 0.92); backdrop-filter: blur(10px);
            padding: 6px 14px; border-radius: 30px; font-size: 10px; font-weight: 800; color: #0284c7;
            box-shadow: 0 4px 15px rgba(0,0,0,0.12); pointer-events: none;
        }

        /* Responsive Mobile */
        @media (max-width: 576px) {
            #header { top: 10px; padding: 10px 12px; }
            #header h1 { font-size: 13px; }
            #admin-panel { right: 10px; top: 10px; width: calc(100vw - 20px); }
            #footer-credits { font-size: 9px; padding: 4px 10px; }
        }
    </style>
</head>
<body>

    <!-- Header nổi -->
    <div id="header">
        <h1><i class="fa-solid fa-heart-pulse" style="margin-right:5px; color:#0284c7;"></i>BẢN ĐỒ KHÁM SỨC KHỎE PHƯỜNG TÂN HẢI</h1>
        <p>XẾP HẠNG TIẾN ĐỘ THI ĐƯA CÁC KHU PHỐ (CẬP NHẬT THEO THỜI GIAN THỰC)</p>
        
        <div class="stats-summary">
            <div class="stat-card"><i class="fa-solid fa-user-check" style="color:#0284c7;"></i> Đã khám: <b style="color:#0284c7;" id="txt-tong-da-kham">0</b></div>
            <div class="stat-card"><i class="fa-solid fa-users" style="color:#64748b;"></i> Dân số: <b style="color:#0f172a;" id="txt-tong-dan-so">0</b></div>
            <div class="stat-card"><i class="fa-solid fa-chart-line" style="color:#16a34a;"></i> Tỷ lệ: <b style="color:#16a34a;" id="txt-ty-le-chung">0%</b></div>
        </div>
    </div>

    <!-- BẢNG NHẬP LIỆU ĐỘNG -->
    <div id="admin-panel">
        <h3><i class="fa-solid fa-pen-to-square"></i> Cập Nhật Số Liệu</h3>
        <div id="input-fields-list"></div>
        <button class="btn-custom" style="width: 100%; justify-content: center; margin-top: 10px;" onclick="toggleAdminPanel()">
            <i class="fa-solid fa-check"></i> Hoàn tất nhập
        </button>
    </div>

    <!-- Bản đồ -->
    <div id="map"></div>

    <!-- Footer Credit -->
    <div id="footer-credits">
        <i class="fa-solid fa-hospital"></i> TRUNG TÂM CUNG ỨNG DỊCH VỤ CÔNG PHƯỜNG TÂN HẢI
    </div>

    <!-- Group Nút Điều khiển -->
    <div class="controls-group">
        <button id="chart-toggle-btn" class="btn-custom" onclick="toggleChart()"><i class="fa-solid fa-chart-column"></i> Biểu đồ</button>
        <button class="btn-custom btn-edit" onclick="toggleAdminPanel()"><i class="fa-solid fa-pen"></i> Nhập số liệu</button>
        <button class="btn-custom btn-secondary-custom" onclick="resetMapView()"><i class="fa-solid fa-compress"></i></button>
    </div>

    <!-- Frame Biểu đồ -->
    <div id="chart-container">
        <h4><i class="fa-solid fa-trophy"></i> Xếp hạng Tỷ lệ đã khám (%)</h4>
        <div style="height: 230px; position: relative;"><canvas id="rateChart"></canvas></div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        var DEFAULT_CENTER = [10.5150, 107.1200];
        var DEFAULT_ZOOM = 13;

        var map = L.map('map', {zoomControl: false}).setView(DEFAULT_CENTER, DEFAULT_ZOOM);
        L.tileLayer('https://mt1.google.com/vt/lyrs=m&x={x}&y={y}&z={z}', { maxZoom: 20, attribution: '© Google Maps' }).addTo(map);

        // Dữ liệu ban đầu của 9 khu phố (Cho phép sửa linh hoạt)
        var khuPhoData = [
            { name: "Phước Thành", center: [10.5420, 107.1350], polygon: [[10.5480, 107.1280], [10.5480, 107.1420], [10.5360, 107.1420], [10.5360, 107.1280]], numTongDan: 1350, numDaKham: 1302 },
            { name: "Cát Hải", center: [10.4950, 107.1120], polygon: [[10.5000, 107.1060], [10.5000, 107.1180], [10.4900, 107.1180], [10.4900, 107.1060]], numTongDan: 2123, numDaKham: 1373 },
            { name: "Láng Cát", center: [10.5180, 107.1250], polygon: [[10.5230, 107.1180], [10.5230, 107.1320], [10.5130, 107.1320], [10.5130, 107.1180]], numTongDan: 3893, numDaKham: 1752 },
            { name: "Phước Hiệp", center: [10.5260, 107.1120], polygon: [[10.5310, 107.1050], [10.5310, 107.1190], [10.5210, 107.1190], [10.5210, 107.1050]], numTongDan: 3220, numDaKham: 1461 },
            { name: "Chu Hải", center: [10.5000, 107.1200], polygon: [[10.5050, 107.1140], [10.5050, 107.1260], [10.4950, 107.1260], [10.4950, 107.1140]], numTongDan: 3950, numDaKham: 1785 },
            { name: "Phước Hải", center: [10.5020, 107.1280], polygon: [[10.5070, 107.1220], [10.5070, 107.1340], [10.4970, 107.1340], [10.4970, 107.1220]], numTongDan: 3320, numDaKham: 1616 },
            { name: "Phước Long", center: [10.4900, 107.1020], polygon: [[10.4950, 107.0950], [10.4950, 107.1090], [10.4850, 107.1090], [10.4850, 107.0950]], numTongDan: 3680, numDaKham: 1515 },
            { name: "Phước Tấn", center: [10.5320, 107.1220], polygon: [[10.5370, 107.1150], [10.5370, 107.1290], [10.5270, 107.1290], [10.5270, 107.1150]], numTongDan: 3950, numDaKham: 1711 },
            { name: "Đông Hải", center: [10.5080, 107.1350], polygon: [[10.5130, 107.1280], [10.5130, 107.1420], [10.5030, 107.1420], [10.5030, 107.1280]], numTongDan: 2836, numDaKham: 1494 }
        ];

        var mapLayersGroup = L.layerGroup().addTo(map);
        var rateChart = null;

        // TỰ ĐỘNG TẠO BẢNG NHẬP SỐ LIỆU ĐỘNG
        function initInputPanel() {
            var container = document.getElementById('input-fields-list');
            container.innerHTML = '';
            khuPhoData.forEach((kp, idx) => {
                var row = document.createElement('div');
                row.className = 'input-row';
                row.innerHTML = `
                    <label>${kp.name}:</label>
                    <input type="number" value="${kp.numDaKham}" placeholder="Đã khám" onchange="updateSingleData(${idx}, 'numDaKham', this.value)">
                    <input type="number" value="${kp.numTongDan}" placeholder="Tổng dân" onchange="updateSingleData(${idx}, 'numTongDan', this.value)">
                `;
                container.appendChild(row);
            });
        }

        function updateSingleData(index, field, value) {
            khuPhoData[index][field] = parseInt(value) || 0;
            renderAllSystem(); // Cập nhật lại toàn bộ hệ thống
        }

        // TÍNH TOÁN & CẬP NHẬT GIAO DIỆN HỆ THỐNG
        function renderAllSystem() {
            mapLayersGroup.clearLayers(); // Xóa các nét vẽ cũ

            // Tính toán tổng
            var sumDaKham = khuPhoData.reduce((acc, cur) => acc + cur.numDaKham, 0);
            var sumTongDan = khuPhoData.reduce((acc, cur) => acc + cur.numTongDan, 0);
            var tyLeChung = sumTongDan > 0 ? (sumDaKham / sumTongDan * 100).toFixed(1) : 0;

            document.getElementById('txt-tong-da-kham').innerText = sumDaKham.toLocaleString('vi-VN');
            document.getElementById('txt-tong-dan-so').innerText = sumTongDan.toLocaleString('vi-VN');
            document.getElementById('txt-ty-le-chung').innerText = tyLeChung + '%';

            // Tính % từng khu phố & Sắp xếp thứ hạng
            khuPhoData.forEach(kp => {
                kp.tyleDaKham = kp.numTongDan > 0 ? parseFloat(((kp.numDaKham / kp.numTongDan) * 100).toFixed(1)) : 0;
                kp.numCanKham = Math.max(0, kp.numTongDan - kp.numDaKham);
            });

            khuPhoData.sort((a, b) => b.tyleDaKham - a.tyleDaKham);

            // Gán thứ hạng & màu sắc
            khuPhoData.forEach((kp, index) => {
                kp.hang = index + 1;
                if (kp.hang <= 3) { kp.color = "#16a34a"; }
                else if (kp.hang <= 6) { kp.color = "#d97706"; }
                else { kp.color = "#dc2626"; }
            });

            // Vẽ lại bản đồ
            khuPhoData.forEach(function(kp) {
                var isWarningGroup = kp.hang > 6;
                var poly = L.polygon(kp.polygon, {
                    color: kp.color, weight: isWarningGroup ? 3.5 : 2.5, opacity: 0.9,
                    fillColor: kp.color, fillOpacity: isWarningGroup ? 0.45 : 0.35
                }).addTo(mapLayersGroup);

                kp.polyInstance = poly;

                var labelClass = 'khupho-label' + (isWarningGroup ? ' label-warning' : '');
                var labelMarker = L.marker(kp.center, {
                    icon: L.divIcon({
                        className: labelClass,
                        html: `<span>${kp.hang}</span> ${kp.name}`,
                        iconSize: null
                    })
                }).addTo(mapLayersGroup);

                var popupContent = `
                    <div style="font-size:13px; font-weight:800; border-bottom:2px solid #f1f5f9; padding-bottom:5px; margin-bottom:6px; display:flex; justify-content:space-between;">
                        <span>KHU PHỐ ${kp.name}</span>
                        <span style="background:${kp.color}; color:#fff; padding:2px 8px; border-radius:12px; font-size:10px;">HẠNG ${kp.hang}</span>
                    </div>
                    <div>Tỷ lệ đã khám: <b style="color:${kp.color}; font-size:15px;">${kp.tyleDaKham}%</b></div>
                    <div>Tổng dân số: <b>${kp.numTongDan.toLocaleString('vi-VN')} người</b></div>
                    <div style="background:#f8fafc; border:1px solid #e2e8f0; border-radius:8px; padding:6px; margin-top:6px;">
                        <div>Còn cần khám: <b>${kp.numCanKham.toLocaleString('vi-VN')} người</b></div>
                        <div style="color:#0284c7; margin-top:3px;">Đã khám thành công: <b>${kp.numDaKham.toLocaleString('vi-VN')} người</b></div>
                    </div>
                `;

                poly.bindPopup(popupContent);
                labelMarker.bindPopup(popupContent);
                labelMarker.on('click', function() { poly.openPopup(); map.flyTo(kp.center, 14); });
            });

            updateChart();
        }

        // CẬP NHẬT BIỂU ĐỒ CHART.JS
        function updateChart() {
            var labels = khuPhoData.map(d => `${d.hang}.${d.name}`);
            var dataValues = khuPhoData.map(d => d.tyleDaKham);
            var barColors = khuPhoData.map(d => d.color);

            var ctx = document.getElementById('rateChart').getContext('2d');
            
            if (rateChart) { rateChart.destroy(); }

            rateChart = new Chart(ctx, {
                type: 'bar',
                data: { labels: labels, datasets: [{ label: 'Tỷ lệ %', data: dataValues, backgroundColor: barColors, borderRadius: 6 }] },
                options: {
                    responsive: true, maintainAspectRatio: false,
                    plugins: { legend: { display: false } },
                    scales: {
                        y: { beginAtZero: true, max: 100, ticks: { color: '#64748b', font: { size: 9 }, callback: v => v + '%' } },
                        x: { ticks: { color: '#0f172a', font: { size: 8, weight: '700' } }, grid: { display: false } }
                    },
                    onClick: (e, activeElements) => {
                        if (activeElements.length > 0) {
                            var index = activeElements[0].index;
                            var targetKp = khuPhoData[index];
                            map.flyTo(targetKp.center, 15);
                            targetKp.polyInstance.openPopup();
                        }
                    }
                }
            });
        }

        function toggleAdminPanel() {
            var panel = document.getElementById('admin-panel');
            panel.style.display = (panel.style.display === 'none' || panel.style.display === '') ? 'block' : 'none';
        }

        function toggleChart() {
            var container = document.getElementById('chart-container');
            var btn = document.getElementById('chart-toggle-btn');
            if (container.style.display === 'none' || container.style.display === '') {
                container.style.display = 'block'; btn.innerHTML = '<i class="fa-solid fa-xmark"></i> Đóng';
            } else {
                container.style.display = 'none'; btn.innerHTML = '<i class="fa-solid fa-chart-column"></i> Biểu đồ';
            }
        }

        function resetMapView() { map.flyTo(DEFAULT_CENTER, DEFAULT_ZOOM); }

        // Khởi chạy hệ thống lần đầu
        initInputPanel();
        renderAllSystem();
    </script>
</body>
</html>
