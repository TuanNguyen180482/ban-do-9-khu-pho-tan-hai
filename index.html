<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bản đồ 9 Khu phố phường Tân Hải</title>
    <!-- Tải thư viện CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        /* Cài đặt chung */
        body { margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #e9ecef;}
        
        /* Bản đồ tràn viền 100% màn hình */
        #map { height: 100vh; width: 100%; z-index: 1;}
        
        /* Giao diện Header nổi bóng bẩy (Hiệu ứng kính mờ) */
        #header { 
            position: absolute; 
            top: 20px; 
            left: 50%; 
            transform: translateX(-50%); 
            z-index: 1000; 
            background: rgba(255, 255, 255, 0.85); 
            backdrop-filter: blur(8px);
            color: #004a99; 
            padding: 15px 35px; 
            text-align: center; 
            border-radius: 50px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.15);
            border: 1px solid rgba(255,255,255,0.6);
            white-space: nowrap;
        }
        #header h1 { margin: 0; font-size: 22px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.5px;}
        #header p { margin: 4px 0 0 0; font-size: 14px; color: #444; font-weight: 500;}
        
        /* Bảng chú giải bo góc hiện đại */
        .legend { 
            background: rgba(255, 255, 255, 0.95); 
            padding: 15px 20px; 
            border-radius: 12px; 
            box-shadow: 0 5px 20px rgba(0,0,0,0.15); 
            line-height: 26px; 
            font-size: 14px;
            color: #333;
        }
        .legend b { font-size: 15px; color: #004a99; display: block; margin-bottom: 5px;}
        .legend i { width: 16px; height: 16px; float: left; margin-right: 10px; margin-top: 5px; border-radius: 50%; border: 1px solid #fff; box-shadow: 0 0 4px rgba(0,0,0,0.4);}

        /* Popup hiện đại */
        .leaflet-popup-content-wrapper { border-radius: 10px; box-shadow: 0 5px 15px rgba(0,0,0,0.2); }
        .leaflet-popup-content { margin: 15px; font-size: 14px; line-height: 1.5; }
        
        /* Hiệu ứng nhịp đập (Mềm mại hơn) */
        .diem-nhap-nhay {
            animation: nhipDap 1.2s infinite ease-in-out;
        }
        @keyframes nhipDap {
            0% { fill-opacity: 0.5; stroke-width: 1; }
            50% { fill-opacity: 1; stroke-width: 5; stroke: rgba(40, 167, 69, 0.6); }
            100% { fill-opacity: 0.5; stroke-width: 1; }
        }
    </style>
</head>
<body>

    <!-- Tiêu đề lơ lửng -->
    <div id="header">
        <h1>🗺️ BẢN ĐỒ PHƯỜNG TÂN HẢI</h1>
        <p>Tỷ lệ người dân các khu phố cần khám sức khỏe trên địa bàn phường </p>
    </div>

    <!-- Khung chứa bản đồ -->
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // Khởi tạo bản đồ
        var map = L.map('map', {zoomControl: false}).setView([10.5360, 107.1350], 13);
        
        // Chuyển nút Zoom xuống góc dưới bên trái cho đỡ vướng Header
        L.control.zoom({ position: 'bottomleft' }).addTo(map);

        // Lớp bản đồ nền
        L.tileLayer('https://mt1.google.com/vt/lyrs=m&x={x}&y={y}&z={z}', {
            attribution: '© Google Maps',
            maxZoom: 20
        }).addTo(map);

        // Chèn ảnh ranh giới
        var imageUrl = './anh_ranh_gioi_tan_hai.png'; 
        var imageBounds = [[10.5015, 107.0985], [10.5720, 107.1680]]; 
        L.imageOverlay(imageUrl, imageBounds, {
            opacity: 0.65, 
            interactive: false 
        }).addTo(map);
// Bấm chuột vào bất kỳ đâu trên bản đồ để lấy tọa độ
        map.on('click', function(e) {
            var lat = e.latlng.lat.toFixed(4);
            var lng = e.latlng.lng.toFixed(4);
            alert("Tọa độ bạn vừa bấm:\n\nlat: " + lat + "\nlng: " + lng);
        });
       // Dữ liệu 9 khu phố (ĐÃ TINH CHỈNH VỊ TRÍ PHƯỚC HIỆP VÀ ĐÔNG HẢI)
        var khuPhoData = [
            { 
                name: "Chu Hải", lat: 10.5380, lng: 107.1470, 
                tyle: 83.6, danhGia: "Trung bình", tongCong: "3.143", tuoi18_60: "2.583", 
                laoDongTuDo: "2.066,4", tuoi60TroLen: "560", congTuoi18TroLen: "3.143", soCanKham: "2.626,4" 
            },
            { 
                name: "Phước Thành", lat: 10.5550, lng: 107.1450, 
                tyle: 86.5, danhGia: "Tốt", tongCong: "2.850", tuoi18_60: "2.300", 
                laoDongTuDo: "1.840", tuoi60TroLen: "550", congTuoi18TroLen: "2.850", soCanKham: "2.465,25" 
            },
            { 
                name: "Phước Tân", lat: 10.5400, lng: 107.1260, 
                tyle: 82.0, danhGia: "Trung bình", tongCong: "2.500", tuoi18_60: "2.000", 
                laoDongTuDo: "1.600", tuoi60TroLen: "500", congTuoi18TroLen: "2.500", soCanKham: "2.050" 
            },
            { 
                // 🎯 ĐÃ DỜI PHƯỚC HIỆP SANG PHẢI MỘT CHÚT (107.1180 -> 107.1200)
                name: "Phước Hiệp", lat: 10.5352, lng: 107.1217, 
                tyle: 75.2, danhGia: "Mức thấp", tongCong: "1.900", tuoi18_60: "1.500", 
                laoDongTuDo: "1.200", tuoi60TroLen: "400", congTuoi18TroLen: "1.900", soCanKham: "1.428,8" 
            },
            { 
                name: "Láng Cát", lat: 10.5300, lng: 107.1300, 
                tyle: 88.1, danhGia: "Tốt", tongCong: "3.000", tuoi18_60: "2.400", 
                laoDongTuDo: "1.920", tuoi60TroLen: "600", congTuoi18TroLen: "3.000", soCanKham: "2.643" 
            },
            { 
                // 🎯 ĐÃ DỜI ĐÔNG HẢI SANG TRÁI MỘT CHÚT (107.1510 -> 107.1480)
                name: "Đông Hải", lat: 10.5240, lng: 107.1427, 
                tyle: 81.4, danhGia: "Trung bình", tongCong: "2.100", tuoi18_60: "1.700", 
                laoDongTuDo: "1.360", tuoi60TroLen: "400", congTuoi18TroLen: "2.100", soCanKham: "1.709,4" 
            },
            { 
                name: "Phước Hải", lat: 10.5233, lng: 107.1360, 
                tyle: 79.9, danhGia: "Mức thấp", tongCong: "2.400", tuoi18_60: "1.950", 
                laoDongTuDo: "1.560", tuoi60TroLen: "450", congTuoi18TroLen: "2.400", soCanKham: "1.917,6" 
            },
            { 
                name: "Cát Hải", lat: 10.5191, lng: 107.1270, 
                tyle: 84.5, danhGia: "Trung bình", tongCong: "2.700", tuoi18_60: "2.200", 
                laoDongTuDo: "1.760", tuoi60TroLen: "500", congTuoi18TroLen: "2.700", soCanKham: "2.281,5" 
            },
            { 
                name: "Phước Long", lat: 10.5150, lng: 107.1080, 
                tyle: 70.0, danhGia: "Mức thấp", tongCong: "1.800", tuoi18_60: "1.450", 
                laoDongTuDo: "1.160", tuoi60TroLen: "350", congTuoi18TroLen: "1.800", soCanKham: "1.260" 
            }
        ];

        // Vẽ các chấm tròn và nhãn
        khuPhoData.forEach(function(kp) {
            var markerColor = "";
            var classHieuUng = "";

            if (kp.tyle >= 85) {
                markerColor = "#28a745"; // Xanh lá
                classHieuUng = "diem-nhap-nhay"; 
            } else if (kp.tyle >= 80) {
                markerColor = "#ffc107"; // Vàng
            } else {
                markerColor = "#dc3545"; // Đỏ
            }

            var circleMarker = L.circleMarker([kp.lat, kp.lng], {
                radius: 12,
                fillColor: markerColor,
                color: "#fff", // Viền trắng mỏng cho sang trọng
                weight: 1.5,
                opacity: 1,
                fillOpacity: 0.9,
                className: classHieuUng 
            }).addTo(map);

            // Gắn Tooltip (Hiện tên khi rê chuột)
            circleMarker.bindTooltip("<b>" + kp.name + "</b>", {
                direction: 'top', 
                offset: [0, -10],
                opacity: 0.9
            });

            // Gắn Popup (Hiện chi tiết khi click)
            var popupContent = "<div style='text-align:center;'><h3 style='margin:0 0 8px 0; color:#004a99; font-size: 16px;'>" + kp.name + "</h3>" +
                               "<div style='font-size: 14px;'>Tỷ lệ cần khám: <b style='color:" + markerColor + "; font-size: 18px;'>" + kp.tyle + "%</b></div></div>";
            circleMarker.bindPopup(popupContent);
        });
         // Nội dung Popup thiết kế y hệt ảnh mẫu
            var popupContent = `
                <div class="popup-title">KHU PHỐ ${kp.name}</div>
                <div class="popup-row">Tỷ lệ: <b style="color:${markerColor}; font-size:15px;">${kp.tyle}%</b> — ${kp.danhGia}</div>
                <div class="popup-row">Tổng cộng: <b>${kp.tongCong}</b></div>
                <div class="popup-row">18—<60 tuổi: ${kp.tuoi18_60}</div>
                <div class="popup-row">Ước tính lao động tự do (80%): ${kp.laoDongTuDo}</div>
                <div class="popup-row">Từ 60 tuổi trở lên: ${kp.tuoi60TroLen}</div>
                <div class="popup-row">Cộng từ 18 tuổi trở lên: ${kp.congTuoi18TroLen}</div>
                <div class="popup-row">Số cần khám: <b>${kp.soCanKham}</b></div>
            `;
            
            circleMarker.bindPopup(popupContent);
        // Bảng chú giải
        var legend = L.control({position: 'bottomright'});
        legend.onAdd = function (map) {
            var div = L.DomUtil.create('div', 'legend');
            div.innerHTML += '<b>Tỷ lệ cần khám</b>';
            div.innerHTML += '<i style="background: #28a745"></i> Đạt chuẩn (≥ 85%)<br>';
            div.innerHTML += '<i style="background: #ffc107"></i> Cần chú ý (80 - 84.9%)<br>';
            div.innerHTML += '<i style="background: #dc3545"></i> Mức thấp (< 80%)<br>';
            return div;
        };
        legend.addTo(map);
        
    </script>
</body>
</html>
